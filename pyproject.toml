[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort (import sorting)
    "N",  # pep8-naming
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty_drl"
version = "0.1.0"
dependencies = [
    "numpy",
    "pandas",
    "gymnasium",
    "stable-baselines3",
    "torch",
    "yfinance"
]

[tool.setuptools]
packages = ["data", "envs"]
